name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepublishOnly

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-sdk/modelhitch_dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.4.0
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze
      - run: dart test
      - run: dart pub publish --dry-run

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-sdk/modelhitch_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: dart pub publish --dry-run

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Make Gradle wrapper executable
        run: chmod +x android-sdk/gradlew
      - name: Test and build Android SDK
        working-directory: android-sdk
        run: |
          ./gradlew \
            :modelhitch-core:test \
            :modelhitch-android:lintRelease \
            :modelhitch-android:assembleRelease \
            :sample-compose:lintDebug \
            :sample-compose:assembleDebug \
            :modelhitch-core:publishToMavenLocal \
            :modelhitch-android:publishToMavenLocal
          ./gradlew -p consumer-smoke --refresh-dependencies assembleDebug