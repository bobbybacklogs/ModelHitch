name: Publish Android SDK

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: publish-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Make Gradle wrapper executable
        run: chmod +x android-sdk/gradlew
      - name: Validate, test, and publish
        working-directory: android-sdk
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew --no-configuration-cache validateCentralRelease \
            :modelhitch-core:test \
            :modelhitch-android:lintRelease \
            :modelhitch-android:assembleRelease \
            :sample-compose:lintDebug \
            :sample-compose:assembleDebug \
            :modelhitch-core:publishToMavenLocal \
            :modelhitch-android:publishToMavenLocal
          ./gradlew -p consumer-smoke --refresh-dependencies assembleDebug
          ./gradlew :modelhitch-core:publishAndReleaseToMavenCentral
          ./gradlew :modelhitch-android:publishAndReleaseToMavenCentral